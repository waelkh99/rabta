name: rabta
description: "One inbox for Instagram and Facebook Messenger customer conversations."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  # Sends the browser to Meta's approval page, in the same tab so the callback
  # can bring it back. Already in the tree through supabase_flutter; named here
  # because we import it.
  url_launcher: ^6.3.1
  # The browser's own APIs, for the tab title and the notification service
  # worker. Already in the tree through Flutter; named here because we import
  # it directly and an unnamed transitive dependency is one version bump from
  # disappearing.
  web: ^1.1.1
  excel: ^4.0.6
  # Reads the deployed build's hash, to tell a seller with the tab open that a
  # new version is out. Already in the tree through supabase_flutter; named
  # because we import it.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
